[package]
name = "ffnodecomp"
version = "0.1.0"
edition = "2021"
description = "Node-based FFmpeg compositor MVP (native + wasm)"

[lib]
name = "ffnodecomp_web"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ffnodecomp"
path = "src/main.rs"

[dependencies]
# egui 0.29 is deliberately not used: current eframe/egui is 0.37 and
# egui_node_graph2 has not caught up. The canvas in ui/canvas.rs is small.
eframe = "0.37"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# std::time::Instant panics on wasm32-unknown-unknown; web-time falls back to
# std on native and uses performance.now() in the browser.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Window",
] }

# Debug builds of egui are unusably slow without a little optimisation.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
