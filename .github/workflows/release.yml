name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: ffnodecomp
            archive_ext: tar.gz

          # Windows x86_64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: ffnodecomp.exe
            archive_ext: zip

          # macOS Apple Silicon (M1/M2/M3/M4)
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: ffnodecomp
            archive_ext: tar.gz

          # macOS Intel x86_64
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bin_name: ffnodecomp
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Package release artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          RELEASE_DIR="ffnodecomp-${{ github.ref_name }}-${{ matrix.platform.target }}"
          mkdir -p "$RELEASE_DIR"
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin_name }}" "$RELEASE_DIR/"
          cp README.md "$RELEASE_DIR/" 2>/dev/null || true
          cp LICENSE* "$RELEASE_DIR/" 2>/dev/null || true
          tar -czvf "$RELEASE_DIR.tar.gz" "$RELEASE_DIR"
          echo "ASSET_PATH=$RELEASE_DIR.tar.gz" >> $GITHUB_ENV

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RELEASE_DIR="ffnodecomp-${{ github.ref_name }}-${{ matrix.platform.target }}"
          mkdir -p "$RELEASE_DIR"
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin_name }}" "$RELEASE_DIR/"
          cp README.md "$RELEASE_DIR/" 2>/dev/null || true
          cp LICENSE* "$RELEASE_DIR/" 2>/dev/null || true
          7z a "$RELEASE_DIR.zip" "$RELEASE_DIR"
          echo "ASSET_PATH=$RELEASE_DIR.zip" >> $GITHUB_ENV

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
